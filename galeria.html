<style>

:root{
    --accent:#C78363;
    --accent-dark:#A9664B;
    --brown:#5A4036;

    --gray:#9B8A81;
    --gray-dark:#7F6F67;

    --background:#FBF8F5;

    --text:#59463F;
    --text-light:#8B756C;

    --border:#EADFD7;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--background);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
}

/* CONTENT */

.container{
    max-width:1400px;
    margin:35px auto;
    padding:0 20px;
}

.gallery-box{
    background:white;
    border-radius:12px;
    padding:40px;

    border:1px solid var(--border);

    box-shadow:
        0 2px 8px rgba(90,64,54,.05),
        0 8px 24px rgba(90,64,54,.08);
}

/* TITLES */

.page-title{
    margin:0 0 15px;

    text-align:center;

    font-family:'Cormorant Garamond',serif;
    font-size:4rem;
    font-weight:600;

    color:var(--accent-dark);
}

.gallery-box h2{
    margin-top:0;

    text-align:center;

    color:var(--accent-dark);

    font-family:'Cormorant Garamond',serif;
    font-size:2.4rem;
    font-weight:600;
}

.gallery-box p{
    max-width:850px;
    margin:0 auto 40px;

    text-align:center;
    line-height:1.8;

    color:var(--text-light);
}

/* GALLERY */

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:24px;
}

.gallery-grid img{
    width:100%;
    height:360px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid var(--border);

    transition:.35s ease;

    box-shadow:
        0 4px 12px rgba(0,0,0,.05);
}

.gallery-grid img:hover{
    transform:translateY(-4px);

    box-shadow:
        0 10px 25px rgba(90,64,54,.15);
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

    margin-top:40px;
}

.button{
    display:inline-block;

    padding:14px 28px;

    border-radius:8px;

    text-decoration:none;

    color:white;

    font-weight:600;

    transition:.3s;
}

.button:hover{
    transform:translateY(-2px);
}

.button-back{
    background:var(--gray);
}

.button-back:hover{
    background:var(--gray-dark);
}

.button-booksy{
    background:var(--accent);
}

.button-booksy:hover{
    background:var(--accent-dark);
}

/* FOOTER */

footer{
    margin-top:60px;
    padding:25px 20px;

    color:var(--text-light);

    text-align:center;
    font-size:.9rem;

    border-top:1px solid var(--border);
}

footer p{
    margin:0;
}

/* MOBILE */

@media (max-width:768px){

    .container{
        margin:25px auto;
    }

    .gallery-box{
        padding:25px;
    }

    .page-title{
        font-size:2.8rem;
    }

    .gallery-box h2{
        font-size:2rem;
    }

    .gallery-grid{
        grid-template-columns:1fr;
    }

    .gallery-grid img{
        height:280px;
    }

    .buttons{
        flex-direction:column;
    }
}

</style>
</head>
